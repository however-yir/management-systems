name: CI
on: [push, pull_request, workflow_dispatch]

jobs:
  # ===== Structure Verification =====
  verify-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all subdirectories
        run: |
          set -e
          for dir in talentflow-hr DormLink EduFlow partyhub CodeTrainer StudentCore aurora-mall cloud-native-mall; do
            test -d "spring-boot/$dir" || { echo "MISSING: spring-boot/$dir/"; exit 1; }
            test -f "spring-boot/$dir/README.md" || { echo "MISSING: spring-boot/$dir/README.md"; exit 1; }
            echo "OK: spring-boot/$dir/"
          done
          for dir in StaffBase ai_chatbot; do
            test -d "django/$dir" || { echo "MISSING: django/$dir/"; exit 1; }
            test -f "django/$dir/README.md" || { echo "MISSING: django/$dir/README.md"; exit 1; }
            echo "OK: django/$dir/"
          done
          test -f README.md || { echo "MISSING: README.md"; exit 1; }
          echo "=== All 10 subdirectories verified ==="

  # ===== Spring Boot Compile (matrix) =====
  build-spring-boot:
    needs: verify-structure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - { name: talentflow-hr, pom: spring-boot/talentflow-hr/talentflow-platform/pom.xml }
          - { name: DormLink, pom: spring-boot/DormLink/Dormitory_business/pom.xml }
          - { name: EduFlow, pom: spring-boot/EduFlow/teaching-manager-bk/pom.xml }
          - { name: partyhub, pom: spring-boot/partyhub/pom.xml }
          - { name: CodeTrainer, pom: spring-boot/CodeTrainer/springbootx1786/pom.xml }
          - { name: aurora-mall, pom: spring-boot/aurora-mall/pom.xml }
          - { name: cloud-native-mall, pom: spring-boot/cloud-native-mall/pom.xml }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Compile ${{ matrix.project.name }}
        run: mvn -B compile -f ${{ matrix.project.pom }}

  # ===== StudentCore (no Maven) =====
  build-student-core:
    needs: verify-structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Compile StudentCore
        run: |
          cd spring-boot/StudentCore
          find . -name "*.java" > sources.txt
          javac @sources.txt || { echo "StudentCore compile failed"; exit 1; }
          echo "StudentCore compile OK"

  # ===== Django Check (matrix) =====
  check-django:
    needs: verify-structure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - { name: StaffBase, dir: django/StaffBase/djangoProject }
          - { name: ai_chatbot, dir: django/ai_chatbot }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Django check ${{ matrix.project.name }}
        run: |
          pip install django
          cd ${{ matrix.project.dir }}
          python -c "import django; print(f'Django {django.__version__} OK')"
          python manage.py check 2>&1 || echo "::warning::manage.py check returned non-zero (may need DB settings)"
