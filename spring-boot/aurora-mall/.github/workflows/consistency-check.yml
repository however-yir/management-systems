name: Consistency Check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Check route/template/static consistency
        run: ./scripts/check-route-template-assets.sh

      - name: Run Maven tests
        run: mvn -B test
