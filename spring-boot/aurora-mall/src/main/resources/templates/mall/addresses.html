<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="mall/header::head-fragment('Aurora Mall-收货地址','addresses')">
</head>
<body>
<header th:replace="mall/header::header-fragment"></header>
<nav th:replace="mall/header::nav-fragment"></nav>

<div id="personal">
    <div class="self-info center">
        <div th:replace="mall/personal-sidebar::sidebar-fragment"></div>

        <div class="intro fr">
            <div class="grzlbt ml40">收货地址</div>
            <div class="info_item ml40">
                <span>默认地址</span>
                <span th:text="${session.auroraMallUser.address==''?'暂未设置':session.auroraMallUser.address}">暂未设置</span>
                <span><a th:href="@{/personal}">去个人资料修改</a></span>
            </div>
            <div class="ml40" style="padding: 14px 0 24px; color: #757575;">
                当前版本保留单地址模型，后续可扩展为地址簿（新增、编辑、删除、默认地址）。
            </div>
        </div>
        <div class="clear"></div>
    </div>
</div>

<div th:replace="mall/footer::footer-fragment"></div>
<script th:src="@{/admin/plugins/jquery/jquery.min.js}"></script>
<script th:src="@{/mall/js/search.js}" type="text/javascript"></script>
</body>
</html>
