apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-payment
  labels:
    app: mall-payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mall-payment
  template:
    metadata:
      labels:
        app: mall-payment
    spec:
      containers:
        - name: mall-payment
          image: ghcr.io/your-org/cloud-native-mall/mall-payment:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: SECURITY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mall-jwt-secret
                  key: jwt-secret
            - name: SECURITY_JWT_BASE64
              value: "false"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql.default.svc.cluster.local:3306/mall_payment?useSSL=false&allowPublicKeyRetrieval=true
            - name: SPRING_REDIS_HOST
              value: redis.default.svc.cluster.local
